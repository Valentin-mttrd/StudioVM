<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 300 600; src: url('../public/fonts/fraunces-roman.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-style: italic; font-weight: 300 500; src: url('../public/fonts/fraunces-italic.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-weight: 400 700; src: url('../public/fonts/instrument-sans.woff2') format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    background: radial-gradient(60% 80% at 78% 40%, #faf6f0, transparent 70%), #f2ece3;
    color: #2a221c; font-family: 'Instrument Sans', sans-serif;
    padding: 64px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .label { display: flex; align-items: center; gap: 14px; font-size: 17px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #8f4730; }
  .label::before { content: ''; width: 44px; height: 1px; background: currentColor; }
  h1 { font-family: 'Fraunces', serif; font-weight: 330; font-size: 104px; line-height: .95; letter-spacing: -.035em; margin-top: 26px; }
  h1 em { font-style: italic; font-weight: 300; color: #8f4730; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; border-top: 1px solid rgba(42,34,28,.28); padding-top: 22px; font-size: 21px; }
  .brand { font-family: 'Fraunces', serif; font-size: 44px; font-weight: 380; letter-spacing: -.03em; line-height: 1; }
  .brand .a { color: #8f4730; } .brand .y { display: inline-block; font-style: italic; font-weight: 340; transform: rotate(-7deg); }
  .addr { text-align: right; color: #665a4f; line-height: 1.4; }
  .pebble { position: absolute; aspect-ratio: 1/.64;
    background: radial-gradient(60% 50% at 42% 32%, rgba(255,255,255,.38), transparent 70%), linear-gradient(180deg, var(--c) 0%, var(--c) 52%, var(--d) 100%);
    box-shadow: inset 0 -14px 20px -10px rgba(42,34,28,.38), inset 0 8px 12px -8px rgba(255,255,255,.55), inset 10px 0 18px -14px rgba(255,255,255,.4), 0 34px 36px -30px rgba(42,34,28,.5); }
  .p1 { --c:#c98a6c; --d:#9a5a40; width: 320px; right: 56px; top: 90px; border-radius: 50% 50% 47% 53% / 58% 55% 45% 42%; }
  .p2 { --c:#e9c77e; --d:#c08f3a; width: 190px; right: 300px; top: 270px; border-radius: 44% 56% 54% 46% / 62% 56% 44% 38%; }
  .p3 { --c:#e6cf9c; --d:#b8914d; width: 140px; right: 96px; top: 340px; border-radius: 56% 44% 42% 58% / 55% 64% 36% 45%; }
</style>
</head>
<body>
  <div class="pebble p1"></div><div class="pebble p2"></div><div class="pebble p3"></div>
  <div>
    <p class="label">Institut de beauté slow cosmétique · Lorient</p>
    <h1>Prendre soin<br />de vous,<br /><em>autrement.</em></h1>
  </div>
  <div class="foot">
    <span class="brand">L<span class="a">’</span>a<span class="y">ty</span>pique</span>
    <span class="addr">14 rue du Général Dubail, Lorient<br />Réservation en ligne · 09 81 94 09 93</span>
  </div>
</body>
</html>
